# ==============================================================================
# Ansible Inventory: ansible/inventory.ini
# Purpose: Define server nodes, IP addresses, groups, and connection variables
# ==============================================================================

[master]
node-master ansible_host=172.20.0.10

[workers]
node-worker-1 ansible_host=172.20.0.11
node-worker-2 ansible_host=172.20.0.12

[k3s_cluster:children]
master
workers

[k3s_cluster:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_python_interpreter=/usr/bin/python3
ansible_become=true
ansible_become_method=sudo
